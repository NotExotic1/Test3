<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Page Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
    }
    video {
      max-width: 100%;
      max-height: 100%;
    }
    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
    }
    button, input {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover, input[type="range"]:hover {
      background: #45a049;
    }
    input[type="range"] {
      width: 150px;
    }
  </style>
</head>
<body>
  <video id="video" src="Video.mp4" autoplay loop></video>
  <div class="controls">
    <button id="playPause">Pause</button>
    <input id="timeSlider" type="range" min="0" max="100" value="0">
    <input id="volumeSlider" type="range" min="0" max="1" step="0.1" value="0.5">
  </div>

  <script>
    const video = document.getElementById('video');
    const playPauseButton = document.getElementById('playPause');
    const timeSlider = document.getElementById('timeSlider');
    const volumeSlider = document.getElementById('volumeSlider');

    // Play/Pause functionality
    playPauseButton.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        playPauseButton.textContent = 'Pause';
      } else {
        video.pause();
        playPauseButton.textContent = 'Play';
      }
    });

    // Update time slider as the video plays
    video.addEventListener('timeupdate', () => {
      timeSlider.value = (video.currentTime / video.duration) * 100;
    });

    // Seek video when slider is moved
    timeSlider.addEventListener('input', () => {
      video.currentTime = (timeSlider.value / 100) * video.duration;
    });

    // Volume control
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
    });
  </script>
</body>
</html>
